name: Prepare compatible dependency fixes
on:
  push:
    branches: [codex/prescription-recipe]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched dependency versions
        run: |
          npm pkg set 'overrides.@grpc/grpc-js=^1.13.6'
          npm audit fix --package-lock-only --ignore-scripts
      - name: Report lockfile delta
        if: always()
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {execFileSync} from "node:child_process"; const before=JSON.parse(execFileSync("git",["show","HEAD:package-lock.json"],{encoding:"utf8"})); const after=JSON.parse(fs.readFileSync("package-lock.json","utf8")); const changed={}; for(const key of new Set([...Object.keys(before.packages),...Object.keys(after.packages)])){if(JSON.stringify(before.packages[key])!==JSON.stringify(after.packages[key]))changed[key]=after.packages[key]??null;} console.log("LOCKFILE_DELTA="+JSON.stringify(changed));'
      - run: npm audit --audit-level=low
