name: Exercise the release validator with real vendor definitions
on:
  push:
    branches: ['audit/validation-runtime-ubuntu-20261103']
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Build the matching operating-system inventory
        run: |
          mkdir -p data && cd data
          cat > Dockerfile <<'DOCKER'
          FROM ubuntu@sha256:262df65c0ec6bf8d9dcc87454f4330a05fae4b97825f45854af3b136666584c2
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk python3 tzdata libstdc++6 libatomic1 ca-certificates libfreetype6 libjpeg-turbo8 zlib1g && rm -rf /var/lib/apt/lists/*
          DOCKER
          docker build --platform linux/amd64 --quiet -t vendor-inventory:local .
          docker run --rm --network none vendor-inventory:local sh -ec '. /etc/os-release; test "$ID:$VERSION_ID:$VERSION_CODENAME" = "ubuntu:26.10:stonking"; cat /etc/os-release'
          docker run --rm --network none vendor-inventory:local dpkg-query -W -f='${Package}\t${Version}\n' > packages.tsv
          docker run --rm --network none vendor-inventory:local dpkg-query -W > manifest
          python - <<'PY'
          import hashlib,pathlib,re
          pairs=[s.split('\t') for s in pathlib.Path('packages.tsv').read_text().splitlines()]
          rows=sorted(n+'\t'+re.sub(r'^\d+:','',v) for n,v in pairs)
          digest=hashlib.sha256(('\n'.join(rows)+'\n').encode()).hexdigest()
          print('INVENTORY',len(rows), digest)
          assert len(rows)==298 and digest=='445f9e3cda9c2eec8b87bd92e5145ce5bea6c98e511170f01793aebb61c3cef5', 'Inventory differs from the fully exercised runtime'
          PY
      - name: Evaluate release-specific Canonical CVE and USN definitions
        run: |
          cd data
          sudo apt-get -qq update
          sudo apt-get -y -qq install openscap-scanner >/dev/null
          for kind in cve usn; do
            curl --fail --silent --show-error --retry 2 --proto '=https' "https://security-metadata.canonical.com/oval/oci.com.ubuntu.stonking.$kind.oval.xml.bz2" -o "$kind.xml.bz2"
            bzip2 -dc "$kind.xml.bz2" > "$kind.xml"
            sha256sum "$kind.xml"
            oscap oval eval --results "$kind-result.xml" "$kind.xml" > "$kind-eval.log"
          done
          mv manifest manifest-real
          awk -F '\t' 'BEGIN{OFS="\t"}{print $1,"0.0.0"}' manifest-real > manifest
          oscap oval eval --results control-result.xml usn.xml > control-eval.log
          mv manifest-real manifest
          cat > check-ubuntu-oval.py <<'PY'
          """Gate the release image on Canonical's OCI OVAL results and a known-old manifest."""
          from collections import Counter
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          
          NAMESPACE = "oval:com.ubuntu.stonking:def:"
          SEVERITIES = {"critical", "high", "medium", "low", "negligible", "untriaged", "unknown"}
          
          
          def evaluate(feed, result, kind):
              root = ET.parse(feed).getroot()
              generator = root.find("{*}generator")
              if (generator is None or generator.findtext("{*}product_name") != "Canonical OVAL Generator"
                      or not generator.findtext("{*}product_version")):
                  raise SystemExit(f"Missing Canonical generator identity in {feed}")
              definitions = {}
              expected_class = "patch" if feed == "usn.xml" else "vulnerability"
              for node in root.findall("./{*}definitions/{*}definition"):
                  key = node.get("id", "")
                  platforms = {el.text for el in node.findall("./{*}metadata/{*}affected/{*}platform")}
                  if (not key.startswith(NAMESPACE) or key in definitions or platforms != {"Ubuntu 26.10"}
                          or node.get("class") != expected_class):
                      raise SystemExit(f"Unexpected definition, class or Ubuntu release in {feed}")
                  definitions[key] = node
              if not definitions:
                  raise SystemExit(f"No Canonical Stonking definitions in {feed}")
              states = Counter()
              findings = Counter()
              seen = set()
              for row in ET.parse(result).getroot().findall(".//{*}definition"):
                  key = row.get("definition_id")
                  if not key:
                      continue
                  if key not in definitions or key in seen:
                      raise SystemExit(f"Unexpected or duplicated OVAL definition in {result}")
                  seen.add(key)
                  state = row.get("result")
                  states[state] += 1
                  if state != "true":
                      continue
                  severity = definitions[key].findtext(".//{*}severity", default="unknown").lower()
                  if severity in ("", "none"):
                      severity = "unknown"
                  if severity not in SEVERITIES:
                      raise SystemExit(f"Unknown OVAL severity in {result}")
                  findings[severity] += 1
              if seen != set(definitions):
                  raise SystemExit(f"Incomplete definition coverage in {result}")
              line = f"{kind}: {len(seen)} definitions, states {dict(states)}, applicable by vendor severity {dict(findings)}"
              print(line)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
                  print(f"- {line}", file=out)
              if set(states) - {"true", "false"}:
                  raise SystemExit(f"Inconclusive OVAL outcomes for {kind}")
              return findings
          
          
          usns = evaluate("usn.xml", "usn-result.xml", "Stonking security notices")
          cves = evaluate("cve.xml", "cve-result.xml", "Stonking vulnerabilities")
          control = evaluate("usn.xml", "control-result.xml", "Old-version positive control")
          if sum(control.values()) <= sum(usns.values()):
              raise SystemExit("Changing installed versions to an old baseline did not trigger additional security notices")
          if usns or any(cves[s] for s in ("critical", "high", "unknown", "untriaged")):
              raise SystemExit("Applicable vendor notices, high/critical or unclassified CVEs need review")
          PY
          python3 check-ubuntu-oval.py
          python3 -c "import xml.etree.ElementTree as E; f=E.parse('cve.xml'); f.find('.//{*}affected/{*}platform').text='Ubuntu 26.04'; f.write('cve.xml',encoding='utf-8')"
          if python3 check-ubuntu-oval.py > negative.log 2>&1; then exit 1; fi
          grep -q 'Unexpected definition, class or Ubuntu release' negative.log
