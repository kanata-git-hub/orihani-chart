name: Inspect official release feed boundaries
on:
  push:
    branches: ['audit/validation-runtime-ubuntu-20261103']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review release metadata and identifiers
        run: |
          for kind in usn cve; do
            curl --proto '=https' -fsSL --retry 3 "https://security-metadata.canonical.com/oval/oci.com.ubuntu.stonking.$kind.oval.xml.bz2" | bzip2 -dc > "$kind.xml"
          done
          python - <<'PY'
          from collections import Counter
          import xml.etree.ElementTree as ET
          for name in ['usn','cve']:
              root=ET.parse(name+'.xml').getroot()
              gen=root.find('{*}generator')
              definitions=root.find('{*}definitions')
              def patterns(d,tag):
                  return Counter(x.text for r in d for x in r.findall('.//{*}'+tag))
              print('FEED',name,'GEN',[(x.tag,x.text) for x in gen], 'PREFIXES', dict(Counter(x.get('id').rsplit(':',1)[0] for x in definitions)))
              print('PLATFORMS',patterns(definitions,'platform').most_common(20),'PRODUCTS',patterns(definitions,'product_name').most_common(5))
              for group in ('class','version'):
                  print('DEF',group,Counter(x.get(group) for x in definitions))
              for d in list(definitions)[:2]:
                  meta = d.find('{*}metadata')
                  print('SAMPLE', d.get('id'), [(x.tag.rsplit('}',1)[-1], x.text[:100] if x.text else None, x.attrib) for x in meta.iter() if x.tag.rsplit('}',1)[-1] in ('platform','product','reference','title')][:12])
          PY
