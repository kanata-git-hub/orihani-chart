name: One-time Shorts candidate runtime validation
on:
  push:
    branches: ['audit/one-time-os-inventory-20261103']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: orihani-shorts
            commit: f9de726bb3b20571c43589c68104e5bf343f9d3b
    env:
      REPOSITORY: ${{ matrix.repo }}
      SOURCE_COMMIT: ${{ matrix.commit }}
      BOOKWORM: sha256:9f0dde62d10e7ff7a310ecaebd66225f6b46c17e6cb778449a77b05d3541bea2
      TRIXIE: sha256:b0ea3309e53992217c31c10aea3ef3ce47c3fffba7416a1e4a5a60b60373b1ed
    steps:
      - name: Read exact post-fix public source
        run: |
          git init -q app
          git -C app fetch --quiet --no-tags --depth=1 "https://github.com/kanata-git-hub/$REPOSITORY.git" "$SOURCE_COMMIT"
          git -C app checkout --quiet --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$SOURCE_COMMIT"
          grep 'apt-get install .*tzdata' app/Dockerfile
      - name: Build the exact candidate locally
        run: |
          sed "s|^FROM node:22-slim|FROM node:22-trixie-slim@$TRIXIE|" app/Dockerfile > "$RUNNER_TEMP/test.Dockerfile"
          grep -q "^FROM node:22-trixie-slim@$TRIXIE" "$RUNNER_TEMP/test.Dockerfile"
          docker build --platform linux/amd64 --quiet -f "$RUNNER_TEMP/test.Dockerfile" -t shorts-candidate:local app
      - name: Run the complete editor and media suite with actual FFmpeg, font and Pillow
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --tmpfs /app/.editor-test:rw,exec,mode=1777,size=3g --mount type=bind,source="$PWD/app/tests",target=/app/tests,readonly --env FFMPEG_PATH=ffmpeg --env EDITOR_PYTHON_PATH=python3 shorts-candidate:local sh -ec '
            ffmpeg -version | head -1
            fc-match -f "%{family}\n" "Kyobo Handwriting 2024"
            python3 -c "from PIL import Image; print(Image.new(\"RGBA\",(32,32)).size)"
            for suite in editor character-reference background-assets scene-reference video-prompt story-direction production-continuity production-package weekly-images weekly-additions clinic-weekly clinic-reserves kling4 image-quality; do
              echo "SUITE $suite"
              if ! node --test "tests/$suite.test.cjs" > /tmp/test.log 2>&1; then
                grep -E "^(not ok|# Error|# fail|  error:)" /tmp/test.log || true
                tail -28 /tmp/test.log
                exit 1
              fi
              grep -E "^# (tests|pass|fail|skipped|todo) " /tmp/test.log
              grep -q "^# skipped 0" /tmp/test.log
            done
          '
