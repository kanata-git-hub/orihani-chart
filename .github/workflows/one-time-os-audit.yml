name: One-time Shorts caption fidelity comparison
on:
  push:
    branches: ['audit/one-time-os-inventory-20261103']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        release: [source]
    env:
      RELEASE: ${{ matrix.release }}
      SOURCE_SHA: 0601bfff971c1a19ab1fd57d51a019f10bef5741
    steps:
      - name: Read exact public app source and build local candidate
        run: |
          git init -q app
          git -C app fetch --quiet --no-tags --depth=1 https://github.com/kanata-git-hub/orihani-shorts.git "$SOURCE_SHA"
          git -C app checkout --quiet --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$SOURCE_SHA"
          sed "s|^FROM node:22-trixie-slim|FROM node:22-trixie-slim@sha256:b0ea3309e53992217c31c10aea3ef3ce47c3fffba7416a1e4a5a60b60373b1ed|" app/Dockerfile > "$RUNNER_TEMP/reference.Dockerfile"
          grep -q "^FROM node:22-trixie-slim@sha256:b0ea3309e53992217c31c10aea3ef3ce47c3fffba7416a1e4a5a60b60373b1ed" "$RUNNER_TEMP/reference.Dockerfile"
          docker build --platform linux/amd64 --quiet -f "$RUNNER_TEMP/reference.Dockerfile" -t shorts-reference:local app
          python - <<'PY'
          from pathlib import Path
          import os
          release=os.environ["RELEASE"]
          base="node:22-alpine3.24@sha256:025b8e975a61d94e33abeafaad1255ef44e4898cf1a1b6446860009c72e6d284"
          p=Path("app/Dockerfile")
          lines=p.read_text().splitlines()
          assert sum(l.startswith("FROM ") for l in lines)==1 and sum(l.startswith("RUN apt-get") for l in lines)==1 and "USER node" in lines
          binary=(release=="wheel")
          build_deps="python3 py3-pip" if binary else "python3 python3-dev py3-pip py3-setuptools py3-wheel py3-pybind11 build-base freetype-dev fribidi-dev harfbuzz-dev libraqm-dev libjpeg-turbo-dev zlib-dev"
          flags="--only-binary=:all:" if binary else "--no-binary=pillow --no-build-isolation"
          hashes="--hash=sha256:f9bd7d260d986f3553518c5d723544346fa48031f8aef3265d786aeb59845bc0 --hash=sha256:7f6299e494e46253d40c34653cac369412f44ca53b5f85d848d3f95b1ed0546c" if binary else "--hash=sha256:cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510"
          build=["FROM "+base+" AS caption-build",
                 "RUN apk add --no-cache "+build_deps,
                 "RUN echo 'pillow==13.0.0 "+hashes+"' > /tmp/caption-requirements.txt && python3 -m pip --disable-pip-version-check install --no-cache-dir --no-deps --no-compile --require-hashes "+flags+" --target /opt/ori-caption -r /tmp/caption-requirements.txt"]
          for i,line in enumerate(lines):
              if line.startswith("FROM "): lines[i]="FROM "+base
              if line.startswith("RUN apt-get"):
                  runtime=" ffmpeg fontconfig font-noto-cjk python3 tzdata"+("" if binary else " freetype fribidi harfbuzz libraqm libjpeg-turbo zlib")
                  lines[i]="RUN apk add --no-cache"+runtime+"\nCOPY --from=caption-build /opt/ori-caption /opt/ori-caption\nRUN python3 -c \"import pathlib,sysconfig; (pathlib.Path(sysconfig.get_path('purelib')) / 'ori-caption.pth').write_text('/opt/ori-caption' + chr(10))\""
          p.write_text("\n".join(build+[""]+lines)+"\n")
          PY
          docker build --platform linux/amd64 --quiet -t shorts-diag:local app
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges shorts-diag:local python3 -c "import PIL; from PIL import features; import glob; assert PIL.__version__=='13.0.0'; assert PIL.__file__.startswith('/opt/ori-caption/'); assert not glob.glob('/usr/lib/python*/site-packages/PIL'); print('CAPTION_PIL',PIL.__version__,features.version('freetype2'),features.version('jpg'),features.version('zlib'),features.check('raqm')); print('BUNDLED_NATIVE',sorted(x.rsplit('/',1)[-1] for x in glob.glob('/opt/ori-caption/pillow.libs/*')))"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges shorts-diag:local sh -ec '! apk info -e py3-pillow; ! apk info -e py3-pip; ! apk info -e build-base; apk info -v libxml2 ffmpeg python3'

      - name: Compare exact production caption and editor overlay pixels
        run: |
          root="$RUNNER_TEMP/fidelity"
          mkdir -p "$root"
          cat > "$root/legacy.cjs" <<'JS'
          const fs=require('node:fs'), {subtitles}=require('/app/.editor-test/renderer.cjs');
          fs.writeFileSync('/report/overlay.ass', subtitles({title:'',narration:'',thumbnail:'',captions:[{start:0,end:3,text:'퇴근 전, 어깨가 뻐근해요'}]}));
          JS
          for img in reference diag; do
            mkdir -m 0777 "$root/$img"
            printf '%s\n' '{"captions":["오래 앉아 있었더니","퇴근 전, 어깨가 뻐근해요"],"brand":true}' > "$root/$img/req.json"
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --tmpfs /app/.editor-test:rw,exec,mode=1777 --mount type=bind,src="$root/$img",dst=/report --mount type=bind,src="$root/legacy.cjs",dst=/tmp/legacy.cjs,readonly shorts-$img:local sh -ec '
              test "$(id -u)" -ne 0
              unset PYTHONPATH
              python3 -c "import PIL; print(\"PYTHON_ACTUAL\", PIL.__version__,PIL.__file__)"
              python3 scripts/render-clinic-captions.py /report/req.json /report
              node_modules/.bin/esbuild server/editor/render.ts --bundle --platform=node --packages=external --format=cjs --outfile=/app/.editor-test/renderer.cjs
              node /tmp/legacy.cjs
              ffmpeg -y -hide_banner -loglevel error -f lavfi -i color=black:s=1080x1920 -vf ass=/report/overlay.ass -frames:v 1 -threads 1 /report/legacy.png
              for exe in "$(command -v ffmpeg)" "$(command -v fc-match)" "$(command -v python3)"; do
                echo "GIO_DEPENDENCY $exe"; ldd "$exe" | grep -E "libgio-2.0|libglib-2.0" || echo NONE
              done
              pdir=$(python3 -c "import pathlib,PIL; print(pathlib.Path(PIL.__file__).parent)")
              printf "PIL_GIO_LINK "; find "$pdir" -name "*.so" -exec ldd {} \; 2>/dev/null | grep libgio-2.0 | sort -u || true
            '
          done
          cat > "$root/compare.py" <<'PY'
          from PIL import Image,ImageChops,ImageStat
          import pathlib,hashlib,json,collections
          path=pathlib.Path('/report')
          for name in ('clinic-caption-0.png','clinic-caption-1.png','clinic-brand.png','legacy.png'):
              a,b=(Image.open(path/v/name).convert('RGBA') for v in ('reference','diag'))
              assert a.size==b.size==(1080,1920)
              mask=lambda im:im.convert('L').point(lambda x:255 if x>3 else 0) if name=='legacy.png' else im.getchannel('A').point(lambda x:255 if x else 0)
              am,bm=mask(a),mask(b)
              union=ImageChops.lighter(am,bm); single=ImageChops.difference(am,bm)
              total=union.histogram()[255]; positions=single.histogram()[255]
              delta=ImageChops.difference(a,b)
              changed=sum(any(pixel) for pixel in delta.getdata())
              print('CAPTION_PIXELS',json.dumps(dict(image=name,bbox_before=am.getbbox(),bbox_after=bm.getbbox(),union=total,mask_iou=round((total-positions)/total,6),changed_pixels=changed,changed_percent_union=round(100*changed/total,4),mae8bit_union=[round(x,4) for x in ImageStat.Stat(delta,union).mean],byte_identical=a.tobytes()==b.tobytes(),dominant_before=[x[0] for x in collections.Counter(p for p,k in zip(a.getdata(),am.getdata()) if k).most_common(3)],dominant_after=[x[0] for x in collections.Counter(p for p,k in zip(b.getdata(),bm.getdata()) if k).most_common(3)])))
          PY
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --mount type=bind,src="$root",dst=/report,readonly shorts-diag:local python3 /report/compare.py
      - name: Audit OS and retain minimum private evidence
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o trivy.tar.gz 'https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz'
          echo 'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tar.gz' | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          ./trivy image --image-src docker --scanners vuln --pkg-types os --list-all-pkgs --no-progress --format json -o findings.json shorts-diag:local
          ./trivy --version
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),zip=require('node:zlib');
          const doc=JSON.parse(fs.readFileSync('findings.json'));
          const results=doc.Results.filter(x=>x.Class==='os-pkgs');
          if(results.length!==1||!results[0].Packages?.length)throw Error('Incomplete OS inventory');
          const s=results[0], v=s.Vulnerabilities||[], keep=v.filter(x=>['CRITICAL','HIGH'].includes(x.Severity)||x.FixedVersion);
          const packages=s.Packages.map(x=>({n:x.Name,v:x.Version,r:x.Release,src:x.SrcName,sv:x.SrcVersion,sr:x.SrcRelease}));
          const vs=keep.map(x=>({id:x.VulnerabilityID,n:x.PkgName,v:x.InstalledVersion,f:x.FixedVersion||'',s:x.Severity,src:x.SeveritySource||'',status:x.Status,title:x.Title||'',url:x.PrimaryURL||'',vendor:x.VendorSeverity||{}}));
          const os=doc.Metadata.OS;
          const counts={}; for (const x of v){const k=x.Severity+(x.FixedVersion?':fixable':':no-fix');counts[k]=(counts[k]||0)+1;}
          console.log('OS_SUMMARY',JSON.stringify({os,packages:packages.length,counts,distinctCritical:new Set(vs.filter(x=>x.s==='CRITICAL').map(x=>x.id)).size,distinctHighCritical:new Set(vs.filter(x=>['CRITICAL','HIGH'].includes(x.s)).map(x=>x.id)).size}));
          const pub=crypto.createPublicKey({key:Buffer.from('','base64'),format:'der',type:'spki'});
          const key=crypto.randomBytes(32),nonce=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,nonce);
          const blob=Buffer.concat([cipher.update(zip.gzipSync(Buffer.from(JSON.stringify({os,packages,vs,counts})))),cipher.final()]);
          const wrapped=crypto.publicEncrypt({key:pub,oaepHash:'sha256'},key);
          const payload=Buffer.concat([wrapped,nonce,cipher.getAuthTag(),blob]).toString('base64');
          for(let i=0;i<payload.length;i+=1500) console.log('SEALED_OS '+payload.slice(i,i+1500));
          NODE
      - name: Execute candidate's complete synthetic media suite
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --tmpfs /app/.editor-test:rw,exec,mode=1777,size=3g --mount type=bind,source="$PWD/app/tests",target=/app/tests,readonly --env FFMPEG_PATH=ffmpeg --env EDITOR_PYTHON_PATH=python3 shorts-diag:local sh -ec '
            test "$(id -u)" -ne 0
            ffmpeg -version | head -1
            fc-match -f "%{family}\n" "Kyobo Handwriting 2024"
            python3 -c "from PIL import Image; print(Image.new(\"RGBA\",(32,32)).size)"
            npm run test:security > /tmp/security.log || { tail -25 /tmp/security.log; exit 1; }
            for suite in editor character-reference background-assets scene-reference video-prompt story-direction production-continuity production-package weekly-images weekly-additions clinic-weekly clinic-reserves kling4 image-quality; do
              echo "SUITE $suite"
              if ! node --test "tests/$suite.test.cjs" > /tmp/test.log 2>&1; then
                grep -E "^(not ok|# Error|# fail|  error:)" /tmp/test.log || true
                tail -28 /tmp/test.log
                exit 1
              fi
              grep -E "^# (tests|pass|fail|skipped|todo) " /tmp/test.log
              grep -q "^# skipped 0" /tmp/test.log
            done
          '
